name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: 🧪 Backend (Testes, Tipagem & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛡️ Varredura Estrita de Segredos
        run: |
          chmod +x ../scripts/check-secrets.sh
          ../scripts/check-secrets.sh --all

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar Dependências
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: 🔍 Checagem de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Testes Unitários (Vitest)
        run: npm run test

      - name: 🏗️ Compilar Backend
        run: npm run build

  frontend:
    name: 🧪 Frontend (Build Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar Dependências
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: 🏗️ Compilar Frontend (Produção)
        run: npm run build

  merge:
    name: 🔀 Auto-Merge Seguro (Nível 1 - develop)
    needs: [backend, frontend]
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: 🚀 Executar Merge na Develop
        run: gh pr merge --merge "$GITHUB_HEAD_REF"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: 🏷️ Fechar Issues Vinculadas Automaticamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          refs=$(gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq '.closingIssuesReferences[].number' | sort -u)
          for n in $refs; do
            gh issue close "$n" --reason completed --comment "Fechada automaticamente pelo auto-merge do PR #$PR_NUMBER na branch develop."
            echo "Fechada issue #$n"
          done
